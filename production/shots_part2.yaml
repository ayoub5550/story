# SHOT LIST — PART 2 «الحجر الصلب» (10:00–22:00 = 720 s)
# Spec: see AGENTS.md §4. Timecodes are DERIVED from cumulative `dur` (run tools/validate_shots.py) — never hand-edit timecodes.
# method: KF2V = keyframe image (with refs) -> image-to-video | T2V = text/ref-to-video (no hero faces needed)
#         PX = painted still + camera move (ffmpeg) | HF = graphics layer (tools/make_hf.py; plate = renders/keyframes/<ID>_plate.jpg)
# vo / dlg reference the Arabic lines in story/03_screenplay_part2.md (copy the exact text; lines marked ⁺ there were added 2026-10-06).
# Part 2 palette (bible/style.md): more contrast, colder shadows, basalt greys and rust; gold returns in S16–S17.
# Screen direction: from S08 on, uncle and nephew share the frame side by side facing the same way.
# status: todo | kf_done | clip_done | approved

part: 2
fps: 24
resolution: 1920x1080
scenes:

